services:
  - type: web
    name: stock-ai-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    pythonVersion: "3.10"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: FINMIND_API_TOKEN
        sync: false
